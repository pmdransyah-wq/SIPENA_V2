<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nota Dinas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .modal { display: none; }
    .modal.active { display: flex; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #e2e8f0; }
    .action-btn { 
      padding: 0.25rem 0.5rem; 
      border-radius: 0.375rem; 
      font-size: 0.75rem; 
      font-weight: 500; 
      transition: all 0.15s;
    }
    .uraian-3baris {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.45;
      max-height: 4.35em;
      white-space: normal;
      word-break: break-word;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-6">

  <!-- HEADER + TOMBOL AKSI -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Nota Dinas</h1>
      <p class="text-sm text-slate-500">Manajemen data Nota Dinas • Role: <span id="userRole" class="font-semibold text-blue-600">...</span></p>
    </div>
    <div class="flex flex-wrap gap-2" id="actionButtons">
      <button onclick="openModal('add')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Tambah Data
      </button>
      <button onclick="document.getElementById('importFile').click()" id="btnImport" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
        <i class="fa-solid fa-file-import"></i> Import
      </button>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="handleImport(event)">
      <button onclick="exportData()" id="btnExport" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
        <i class="fa-solid fa-file-export"></i> Export
      </button>
      <button onclick="loadData()" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
        <i class="fa-solid fa-rotate"></i> Sinkron
      </button>
      <button onclick="toggleTrash()" id="btnTrash" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
        <i class="fa-solid fa-trash"></i> Tempat Sampah
      </button>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="mb-4">
    <div class="relative max-w-md">
      <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input type="text" id="searchInput" placeholder="Cari No. Nota, Uraian, Bidang, Instansi..." 
             class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
             oninput="filterTable()">
    </div>
  </div>

  <!-- TABLE -->
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm" id="dataTable">
        <thead class="bg-slate-100 text-slate-700">
          <tr>
            <th class="px-3 py-3 text-left font-semibold whitespace-nowrap">No.</th>
            <th class="px-3 py-3 text-left font-semibold whitespace-nowrap">NO. NOTA DINAS</th>
            <th class="px-3 py-3 text-left font-semibold whitespace-nowrap">TANGGAL</th>
            <th class="px-3 py-3 text-left font-semibold min-w-[240px]">URAIAN</th>
            <th class="px-3 py-3 text-left font-semibold">BIDANG</th>
            <th class="px-3 py-3 text-left font-semibold">INSTANSI TUJUAN</th>
            <th class="px-3 py-3 text-left font-semibold min-w-[160px]">KETERANGAN</th>
            <th class="px-3 py-3 text-left font-semibold">LAMPIRAN</th>
            <th class="px-3 py-3 text-center font-semibold">AKSI</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-slate-100">
          <tr><td colspan="9" class="text-center py-8 text-slate-400">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- PAGINATION -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 px-4 py-3 border-t border-slate-200 bg-slate-50">
      <div class="text-sm text-slate-600">
        Menampilkan <span id="pageInfo">0</span> dari <span id="totalData">0</span> data
      </div>
      <div class="flex items-center gap-1" id="paginationButtons"></div>
    </div>
  </div>

  <!-- MODAL TAMBAH / EDIT -->
  <div id="modalForm" class="modal fixed inset-0 bg-black/50 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b border-slate-200 flex justify-between items-center sticky top-0 bg-white z-10">
        <h2 id="modalTitle" class="text-xl font-bold">Tambah Nota Dinas</h2>
        <button onclick="closeModal('modalForm')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="formNota" class="p-6 space-y-4" onsubmit="saveData(event)">
        <input type="hidden" id="editRow">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">No. Agenda</label>
            <input type="text" id="noAgenda" readonly class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-slate-50">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">NO. NOTA DINAS</label>
            <input type="text" id="noNota" readonly class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-slate-50 text-blue-700 font-medium text-sm">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
          <input type="date" id="tanggal" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Uraian</label>
          <textarea id="uraian" rows="4" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Bidang</label>
            <select id="bidang" required onchange="updateNoNotaPreview()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">-- Pilih Bidang --</option>
              <option value="Sekr">Sekr</option>
              <option value="PPD">PPD</option>
              <option value="PUEMD">PUEMD</option>
              <option value="PMLKD">PMLKD</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Instansi Tujuan</label>
            <input type="text" id="instansi" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Keterangan</label>
          <input type="text" id="keterangan" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Lampiran (opsional)</label>
          <input type="file" id="lampiran" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="w-full text-sm">
          <p class="text-xs text-slate-500 mt-1">PDF, Word, JPG, PNG</p>
        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" onclick="closeModal('modalForm')" class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-50">Batal</button>
          <button type="submit" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL VIEW -->
  <div id="modalView" class="modal fixed inset-0 bg-black/50 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b flex justify-between items-center sticky top-0 bg-white">
        <h2 class="text-xl font-bold">Detail Nota Dinas</h2>
        <button onclick="closeModal('modalView')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="viewContent" class="p-6 space-y-3 text-sm"></div>
    </div>
  </div>

  <!-- MODAL DISPOSISI -->
  <div id="modalDisposisi" class="modal fixed inset-0 bg-black/50 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
      <div class="p-6 border-b flex justify-between items-center">
        <h2 class="text-xl font-bold">Disposisi</h2>
        <button onclick="closeModal('modalDisposisi')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="p-6">
        <input type="hidden" id="disposisiRow">
        <textarea id="disposisiText" rows="4" placeholder="Isi disposisi..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        <div class="flex justify-end gap-3 mt-4">
          <button onclick="closeModal('modalDisposisi')" class="px-4 py-2 border rounded-lg">Batal</button>
          <button onclick="submitDisposisi()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== GLOBAL ==========
    let currentData = [];
    let filteredData = [];
    let isTrashMode = false;
    let currentPage = 1;
    const PER_PAGE = 15;
    let userRole = '<?= role ?>';

    document.getElementById('userRole').textContent = userRole.toUpperCase();

    // Sembunyikan tombol sesuai role
    if (userRole === 'user') {
      document.querySelectorAll('#actionButtons button').forEach(btn => {
        if (!btn.innerText.includes('Sinkron')) btn.style.display = 'none';
      });
    } else if (userRole === 'admin') {
      document.getElementById('btnImport').style.display = 'none';
      document.getElementById('btnExport').style.display = 'none';
      document.getElementById('btnTrash').style.display = 'none';
    }

    // ========== LOAD DATA ==========
    function loadData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat...</td></tr>';

      google.script.run
        .withSuccessHandler(data => {
          currentData = data || [];
          filteredData = [...currentData];
          currentPage = 1;
          renderTable();
        })
        .withFailureHandler(err => {
          tbody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-red-500">${err.message}</td></tr>`;
        })
        .getAllData(isTrashMode);
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const total = filteredData.length;
      const totalPages = Math.ceil(total / PER_PAGE) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const start = (currentPage - 1) * PER_PAGE;
      const end = start + PER_PAGE;
      const pageData = filteredData.slice(start, end);

      document.getElementById('totalData').textContent = total;
      document.getElementById('pageInfo').textContent = total === 0 ? '0' : `${start + 1}–${Math.min(end, total)}`;

      renderPagination(totalPages);

      if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-slate-400">Belum ada data</td></tr>';
        return;
      }

      tbody.innerHTML = pageData.map(row => {
        const lampiran = row['LAMPIRAN'] 
          ? `<a href="${row['LAMPIRAN']}" target="_blank" class="text-blue-600 hover:underline text-xs"><i class="fa-solid fa-paperclip"></i> Lihat</a>` 
          : '-';

        let aksi = `
          <button onclick="viewData(${row._row})" class="action-btn bg-sky-100 text-sky-700 hover:bg-sky-200" title="View"><i class="fa-solid fa-eye"></i></button>
        `;

        if (userRole !== 'user') {
          aksi += `
            <button onclick="editData(${row._row})" class="action-btn bg-amber-100 text-amber-700 hover:bg-amber-200" title="Edit"><i class="fa-solid fa-pen"></i></button>
            <button onclick="uploadLampiranPrompt(${row._row})" class="action-btn bg-emerald-100 text-emerald-700 hover:bg-emerald-200" title="Upload Lampiran"><i class="fa-solid fa-upload"></i></button>
            <button onclick="openDisposisi(${row._row})" class="action-btn bg-purple-100 text-purple-700 hover:bg-purple-200" title="Disposisi"><i class="fa-solid fa-share"></i></button>
          `;
        }

        if (userRole === 'superadmin') {
          if (isTrashMode) {
            aksi += `
              <button onclick="restore(${row._row})" class="action-btn bg-green-100 text-green-700 hover:bg-green-200" title="Kembalikan"><i class="fa-solid fa-rotate-left"></i></button>
              <button onclick="permanentDel(${row._row})" class="action-btn bg-red-100 text-red-700 hover:bg-red-200" title="Hapus Permanen"><i class="fa-solid fa-trash"></i></button>
            `;
          } else {
            aksi += `<button onclick="hapus(${row._row})" class="action-btn bg-red-100 text-red-700 hover:bg-red-200" title="Hapus"><i class="fa-solid fa-trash"></i></button>`;
          }
        }

        return `
          <tr class="hover:bg-slate-50">
            <td class="px-3 py-2.5 font-medium">${row['No.'] || ''}</td>
            <td class="px-3 py-2.5 font-medium text-blue-700 text-xs">${row['NO. NOTA DINAS'] || ''}</td>
            <td class="px-3 py-2.5 whitespace-nowrap">${formatDate(row['TANGGAL'])}</td>
            <td class="px-3 py-2.5">
              <div class="uraian-3baris" title="${(row['URAIAN'] || '').replace(/"/g, '&quot;')}">${row['URAIAN'] || ''}</div>
            </td>
            <td class="px-3 py-2.5">
              <span class="px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">${row['BIDANG'] || ''}</span>
            </td>
            <td class="px-3 py-2.5">${row['INSTANSI TUJUAN'] || ''}</td>
            <td class="px-3 py-2.5">
              <div class="uraian-3baris">${row['KETERANGAN'] || ''}</div>
            </td>
            <td class="px-3 py-2.5">${lampiran}</td>
            <td class="px-3 py-2.5 text-center space-x-1 whitespace-nowrap">${aksi}</td>
          </tr>
        `;
      }).join('');
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('paginationButtons');
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = `
        <button onclick="goToPage(${currentPage - 1})" 
                class="px-3 py-1.5 rounded-lg border text-sm ${currentPage === 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'}"
                ${currentPage === 1 ? 'disabled' : ''}>
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      `;

      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, startPage + 4);
      if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

      for (let i = startPage; i <= endPage; i++) {
        html += `
          <button onclick="goToPage(${i})" 
                  class="px-3 py-1.5 rounded-lg border text-sm min-w-[36px] ${i === currentPage ? 'bg-blue-600 text-white border-blue-600' : 'hover:bg-slate-100'}">
            ${i}
          </button>
        `;
      }

      html += `
        <button onclick="goToPage(${currentPage + 1})" 
                class="px-3 py-1.5 rounded-lg border text-sm ${currentPage === totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'}"
                ${currentPage === totalPages ? 'disabled' : ''}>
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      `;

      container.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      renderTable();
      document.getElementById('dataTable').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) {
        filteredData = [...currentData];
      } else {
        filteredData = currentData.filter(r => 
          (r['NO. NOTA DINAS'] || '').toLowerCase().includes(q) ||
          (r['URAIAN'] || '').toLowerCase().includes(q) ||
          (r['BIDANG'] || '').toLowerCase().includes(q) ||
          (r['INSTANSI TUJUAN'] || '').toLowerCase().includes(q) ||
          (r['KETERANGAN'] || '').toLowerCase().includes(q) ||
          String(r['No.'] || '').includes(q)
        );
      }
      currentPage = 1;
      renderTable();
    }

    function formatDate(d) {
      if (!d) return '-';
      try {
        const date = new Date(d);
        return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch { return d; }
    }

    // ========== MODAL ==========
    function openModal(mode) {
      document.getElementById('modalForm').classList.add('active');
      document.getElementById('formNota').reset();
      document.getElementById('editRow').value = '';
      document.getElementById('modalTitle').textContent = 'Tambah Nota Dinas';

      google.script.run.withSuccessHandler(no => {
        document.getElementById('noAgenda').value = no;
        updateNoNotaPreview();
      }).getNextNoAgenda();

      document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function updateNoNotaPreview() {
      const no = document.getElementById('noAgenda').value;
      const bidang = document.getElementById('bidang').value;
      if (!no || !bidang) {
        document.getElementById('noNota').value = '';
        return;
      }
      const year = new Date().getFullYear();
      const kodeMap = { 'Sekr': '400.10.4.0', 'PPD': '400.10.4.3', 'PUEMD': '400.10.4.1', 'PMLKD': '400.10.4.2' };
      document.getElementById('noNota').value = `${no}/${kodeMap[bidang] || '400.10.4.0'}/${bidang}-DPMD/${year}`;
    }

    // ========== SAVE ==========
    function saveData(e) {
      e.preventDefault();
      const row = document.getElementById('editRow').value;
      const formData = {
        No_: document.getElementById('noAgenda').value,
        TANGGAL: document.getElementById('tanggal').value,
        URAIAN: document.getElementById('uraian').value,
        BIDANG: document.getElementById('bidang').value,
        INSTANSI_TUJUAN: document.getElementById('instansi').value,
        KETERANGAN: document.getElementById('keterangan').value,
        LAMPIRAN: ''
      };

      const fileInput = document.getElementById('lampiran');
      const doSave = (lampiranUrl) => {
        formData.LAMPIRAN = lampiranUrl || formData.LAMPIRAN;
        if (row) {
          google.script.run
            .withSuccessHandler(() => { closeModal('modalForm'); loadData(); alert('Data berhasil diupdate'); })
            .withFailureHandler(err => alert(err.message))
            .updateData(parseInt(row), formData);
        } else {
          google.script.run
            .withSuccessHandler(() => { closeModal('modalForm'); loadData(); alert('Data berhasil ditambahkan'); })
            .withFailureHandler(err => alert(err.message))
            .addData(formData);
        }
      };

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(ev) {
          const base64 = ev.target.result.split(',')[1];
          google.script.run
            .withSuccessHandler(url => doSave(url))
            .withFailureHandler(err => alert('Gagal upload: ' + err.message))
            .uploadLampiran(base64, file.name, file.type);
        };
        reader.readAsDataURL(file);
      } else {
        doSave('');
      }
    }

    // ========== VIEW / EDIT ==========
    function viewData(row) {
      google.script.run.withSuccessHandler(data => {
        document.getElementById('viewContent').innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><span class="text-slate-500 text-xs">No. Agenda</span><p class="font-medium">${data['No.']}</p></div>
            <div><span class="text-slate-500 text-xs">No. Nota Dinas</span><p class="font-medium text-blue-700">${data['NO. NOTA DINAS']}</p></div>
            <div><span class="text-slate-500 text-xs">Tanggal</span><p class="font-medium">${formatDate(data['TANGGAL'])}</p></div>
            <div><span class="text-slate-500 text-xs">Bidang</span><p class="font-medium">${data['BIDANG']}</p></div>
            <div class="md:col-span-2"><span class="text-slate-500 text-xs">Uraian</span><p class="font-medium whitespace-pre-wrap">${data['URAIAN'] || '-'}</p></div>
            <div class="md:col-span-2"><span class="text-slate-500 text-xs">Instansi Tujuan</span><p class="font-medium">${data['INSTANSI TUJUAN'] || '-'}</p></div>
            <div class="md:col-span-2"><span class="text-slate-500 text-xs">Keterangan</span><p class="font-medium whitespace-pre-wrap">${data['KETERANGAN'] || '-'}</p></div>
            <div class="md:col-span-2"><span class="text-slate-500 text-xs">Lampiran</span><p>${data['LAMPIRAN'] ? `<a href="${data['LAMPIRAN']}" target="_blank" class="text-blue-600 hover:underline">Buka Lampiran</a>` : '-'}</p></div>
          </div>
        `;
        document.getElementById('modalView').classList.add('active');
      }).getDataById(row, isTrashMode);
    }

    function editData(row) {
      google.script.run.withSuccessHandler(data => {
        document.getElementById('modalTitle').textContent = 'Edit Nota Dinas';
        document.getElementById('editRow').value = row;
        document.getElementById('noAgenda').value = data['No.'];
        document.getElementById('noNota').value = data['NO. NOTA DINAS'];
        document.getElementById('tanggal').value = data['TANGGAL'] ? new Date(data['TANGGAL']).toISOString().split('T')[0] : '';
        document.getElementById('uraian').value = data['URAIAN'] || '';
        document.getElementById('bidang').value = data['BIDANG'] || '';
        document.getElementById('instansi').value = data['INSTANSI TUJUAN'] || '';
        document.getElementById('keterangan').value = data['KETERANGAN'] || '';
        document.getElementById('modalForm').classList.add('active');
      }).getDataById(row, false);
    }

    // ========== HAPUS / TRASH ==========
    function hapus(row) {
      if (!confirm('Pindahkan data ke Tempat Sampah?')) return;
      google.script.run.withSuccessHandler(() => loadData()).withFailureHandler(e => alert(e.message)).deleteData(row);
    }

    function restore(row) {
      if (!confirm('Kembalikan data ini?')) return;
      google.script.run.withSuccessHandler(() => loadData()).withFailureHandler(e => alert(e.message)).restoreData(row);
    }

    function permanentDel(row) {
      if (!confirm('Hapus permanen? Data tidak bisa dikembalikan!')) return;
      google.script.run.withSuccessHandler(() => loadData()).withFailureHandler(e => alert(e.message)).permanentDelete(row);
    }

    function toggleTrash() {
      isTrashMode = !isTrashMode;
      document.getElementById('btnTrash').innerHTML = isTrashMode 
        ? '<i class="fa-solid fa-list"></i> Kembali ke Data' 
        : '<i class="fa-solid fa-trash"></i> Tempat Sampah';
      currentPage = 1;
      loadData();
    }

    // ========== DISPOSISI ==========
    function openDisposisi(row) {
      document.getElementById('disposisiRow').value = row;
      document.getElementById('disposisiText').value = '';
      document.getElementById('modalDisposisi').classList.add('active');
    }

    function submitDisposisi() {
      const row = document.getElementById('disposisiRow').value;
      const text = document.getElementById('disposisiText').value;
      if (!text.trim()) return alert('Isi disposisi dulu');
      google.script.run.withSuccessHandler(() => {
        closeModal('modalDisposisi');
        loadData();
        alert('Disposisi tersimpan');
      }).withFailureHandler(e => alert(e.message)).saveDisposisi(parseInt(row), text);
    }

    // ========== UPLOAD LAMPIRAN SAJA ==========
    function uploadLampiranPrompt(row) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.pdf,.doc,.docx,.jpg,.jpeg,.png';
      input.onchange = function() {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          const base64 = ev.target.result.split(',')[1];
          google.script.run
            .withSuccessHandler(url => {
              google.script.run
                .withSuccessHandler(() => { loadData(); alert('Lampiran berhasil diupload'); })
                .withFailureHandler(e => alert(e.message))
                .updateLampiranOnly(row, url);
            })
            .withFailureHandler(err => alert('Gagal upload: ' + err.message))
            .uploadLampiran(base64, file.name, file.type);
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

    // ========== IMPORT / EXPORT ==========
    function exportData() {
      google.script.run.withSuccessHandler(data => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `nota-dinas-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      }).withFailureHandler(e => alert(e.message)).exportData();
    }

    function handleImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const data = JSON.parse(ev.target.result);
          google.script.run
            .withSuccessHandler(res => { alert(`Berhasil import ${res.count} data`); loadData(); })
            .withFailureHandler(err => alert(err.message))
            .importData(JSON.stringify(data));
        } catch (err) {
          alert('File JSON tidak valid');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    // Init
    loadData();
  </script>
</body>
</html>
