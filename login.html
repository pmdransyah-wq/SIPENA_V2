<script>
  // ====================== KONFIGURASI ======================
  // GANTI dengan URL deployment TERBARU setelah kamu deploy ulang
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwZklRdcdvs3Yn2gGLl1cRESlIKrG1OGgVpKS0JELSIAKqBmo0dg5NcwyDBgjOeo4xm/exec";

  // ====================== FUNGSI LOGIN ======================
  function handleLogin(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
      Swal.fire("Peringatan", "Username dan Password wajib diisi", "warning");
      return;
    }

    Swal.fire({
      title: "Memeriksa Akun...",
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    fetch(GAS_URL, {
      method: "POST",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        username: username,
        password: password
      })
    })
    .then(async (response) => {
      const text = await response.text();

      // Coba parse JSON
      try {
        return JSON.parse(text);
      } catch (err) {
        // Kalau yang balik HTML error Google
        console.error("Response bukan JSON:", text.substring(0, 300));
        throw new Error("Server mengembalikan halaman error. Cek deployment Web App.");
      }
    })
    .then(data => {
      if (data.status === "success") {
        localStorage.setItem("arsip_logged_in", "true");
        localStorage.setItem("arsip_username", data.data.username);
        localStorage.setItem("arsip_role", data.data.role);
        localStorage.setItem("arsip_instansi", data.data.instansi);
        localStorage.setItem("arsip_token", data.data.token);

        Swal.fire({
          icon: "success",
          title: "Login Berhasil",
          text: "Selamat datang, " + data.data.username,
          timer: 1500,
          showConfirmButton: false
        }).then(() => {
          window.location.href = "dashboard.html";
        });
      } else {
        Swal.fire("Gagal", data.message || "Username atau Password salah!", "error");
      }
    })
    .catch(error => {
      console.error(error);
      Swal.fire({
        icon: "error",
        title: "Koneksi Gagal",
        html: `
          Tidak dapat terhubung ke Google Apps Script.<br><br>
          <small>${error.message}</small><br><br>
          <b>Solusi:</b> Deploy ulang Web App dengan akses <b>Anyone</b>
        `
      });
    });
  }
</script>
