<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem E-Arsip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-900 font-sans flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-sky-600 text-white rounded-xl mx-auto flex items-center justify-center text-2xl font-bold mb-2 shadow">
                <i class="fa-solid fa-box-archive"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800">Sistem E-Arsip</h1>
            <p class="text-xs text-slate-500">Silakan masuk menggunakan akun Anda</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" id="username" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-sky-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-sky-500" required>
            </div>
            <button type="submit" class="w-full bg-sky-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-sky-700 transition">Masuk Sistem</button>
        </form>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwgiNlfGp5gpgRm5y78NR-Qp5vSlFLMehWSfZFt9JSKKVOnirJ3KWlc68nmHT03-Gj-/exec";

        function handleLogin(e) {
            e.preventDefault();
            const uInput = document.getElementById('username').value.trim();
            const pInput = document.getElementById('password').value.trim();

            Swal.fire({ title: 'Memeriksa Akun...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            fetch(GAS_URL)
                .then(res => res.json())
                .then(data => {
                    Swal.close();
                    if (data.status === "success" && data.Users) {
                        var users = data.Users.slice(1);
                        var found = users.find(u => String(u[0]) === uInput && String(u[1]) === pInput);

                        if (found) {
                            localStorage.setItem('arsip_logged_in', 'true');
                            localStorage.setItem('arsip_username', found[0]);
                            localStorage.setItem('arsip_instansi', found[2]);
                            localStorage.setItem('arsip_role', found[3].toLowerCase());
                            localStorage.setItem('arsip_nama', found[4]);

                            Swal.fire({
                                icon: 'success',
                                title: 'Login Berhasil',
                                text: 'Selamat datang, ' + found[4],
                                timer: 1500,
                                showConfirmButton: false
                            }).then(() => {
                                window.location.href = 'dashboard.html';
                            });
                        } else {
                            Swal.fire('Gagal', 'Username atau Password salah!', 'error');
                        }
                    } else {
                        Swal.fire('Error', 'Gagal memuat data dari server.', 'error');
                    }
                })
                .catch(() => {
                    Swal.close();
                    Swal.fire('Koneksi Gagal', 'Tidak dapat terhubung ke server Google Apps Script.', 'error');
                });
        }
    </script>
</body>
</html>
