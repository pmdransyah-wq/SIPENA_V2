<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistem E-Arsip</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body {
      background-color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-sky-500 rounded-xl mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Sistem E-Arsip</h1>
      <p class="text-slate-500 text-sm mt-1">Silakan masuk menggunakan akun Anda</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-4">
        <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
        <input 
          type="text" 
          id="username" 
          class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-sky-500" 
          placeholder="Masukkan username"
          required
        />
      </div>

      <div class="mb-6">
        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-sky-500" 
          placeholder="Masukkan password"
          required
        />
      </div>

      <button 
        type="submit" 
        class="w-full bg-sky-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-sky-700 transition"
      >
        Masuk Sistem
      </button>
    </form>
  </div>

  <script>
    // ====================== KONFIGURASI ======================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwwYDMUrIz8kpr0hpC-czdqDHxC1xhNuMGItgfLVvc8DuzVydnTreQDA6Av18C_4p82/exec";

    // ====================== FUNGSI LOGIN ======================
    function handleLogin(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        Swal.fire("Peringatan", "Username dan Password wajib diisi", "warning");
        return;
      }

      Swal.fire({
        title: "Memeriksa Akun...",
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });

      fetch(GAS_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          username: username,
          password: password
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          // Simpan session
          localStorage.setItem("arsip_logged_in", "true");
          localStorage.setItem("arsip_username", data.data.username);
          localStorage.setItem("arsip_role", data.data.role);
          localStorage.setItem("arsip_instansi", data.data.instansi);
          localStorage.setItem("arsip_token", data.data.token);

          Swal.fire({
            icon: "success",
            title: "Login Berhasil",
            text: "Selamat datang, " + data.data.username,
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "dashboard.html"; // ganti jika nama file dashboard berbeda
          });
        } else {
          Swal.fire("Gagal", data.message || "Username atau Password salah!", "error");
        }
      })
      .catch(error => {
        console.error(error);
        Swal.fire({
          icon: "error",
          title: "Koneksi Gagal",
          text: "Tidak dapat terhubung ke server. Pastikan koneksi internet stabil dan URL Web App sudah benar."
        });
      });
    }
  </script>

</body>
</html>
